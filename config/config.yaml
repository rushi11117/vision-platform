# ============================================================
# Vision Platform - Master Configuration
# ============================================================

# ── Camera / Source Definitions ─────────────────────────────
cameras:
  - name: Gate1
    stream: 0                          # USB/laptop webcam (index)
    enabled: true
    detectors: [face, person, motion]

  # Uncomment & configure more cameras as needed:
  # - name: Gate2
  #   stream: rtsp://192.168.1.100:554/live
  #   enabled: true
  #   detectors: [person, motion]

  # - name: MobilePhone
  #  stream: rtsp://oldbird:jFwmBUYt6xhU@192.168.0.110:8554
  #  enabled: true
  #  detectors: [motion,person,face]

  # - name: Entrance_Video
  #  stream: D:\Learning\Survell\SurvellSource\Test.mp4
  #  enabled: true
  #  detectors: [face, person]

# ── Detection Settings ───────────────────────────────────────
detection:
  face:
    scale_factor: 1.05        # Scans more pyramid levels (default 1.1 or 1.3 skips small scales)
    min_neighbors: 3          # Lowers clustering requirement (default 5 rejects faint crowd faces)
    min_size: [15, 15]        # Lowers minimum face dimensions from 30x30 to 15x15 pixels
    confidence_threshold: 0.6

  person:
    win_stride: [8, 8]
    padding: [4, 4]
    scale: 1.05
    confidence_threshold: 0.7
    min_area: 1200

  motion:
    threshold: 1000               # minimum contour area (pixels²)
    blur_kernel: 5                # Gaussian blur kernel size
    diff_threshold: 25            # pixel diff threshold for binary mask
    background_subtractor: false  # true = MOG2, false = frame diff

# ── Processing Pipeline ──────────────────────────────────────
processors:
  display:
    enabled: true
    window_title: "Vision Platform"
    draw_boxes: true
    draw_labels: true

  image_save:
    enabled: true
    output_dir: ./storage/snapshots
    format: jpg                   # jpg or png
    quality: 85                   # JPEG quality 1-100
    save_on_detection: true       # only save when something is detected

  video_save:
    enabled: false
    output_dir: ./storage/videos
    codec: mp4v                   # mp4v, XVID, MJPG
    fps: 20
    mode: event                   # continuous | event
    pre_buffer_seconds: 3

  database:
    enabled: true

  alert:
    enabled: false
    cooldown_seconds: 60          # min seconds between same-type alerts
    email:
      enabled: false
      smtp_host: smtp.gmail.com
      smtp_port: 587
      sender: you@gmail.com
      password: ""                # use env var ALERT_EMAIL_PASSWORD
      recipients: [admin@example.com]
    webhook:
      enabled: false
      url: https://hooks.example.com/vision
      timeout_seconds: 5
    sms:
      enabled: false
      # Add Twilio / SNS credentials here
    whatsapp:
      enabled: false

# ── Database ────────────────────────────────────────────────
database:
  type: sqlite                    # sqlite | postgres
  db_path: ./database/vision.db

  # PostgreSQL settings (used when type = postgres):
  # host: localhost
  # port: 5432
  # name: vision_db
  # user: vision_user
  # password: ""                  # use env var DB_PASSWORD

# ── Storage Paths ───────────────────────────────────────────
storage:
  base_path: ./storage
  images_path: ./storage/images
  videos_path: ./storage/videos
  snapshots_path: ./storage/snapshots
  logs_path: ./storage/logs

# ── Logging ─────────────────────────────────────────────────
logging:
  level: INFO                     # DEBUG | INFO | WARNING | ERROR
  log_to_file: true
  log_file: ./storage/logs/platform.log
  max_bytes: 10485760             # 10 MB per file
  backup_count: 5

# ── Workers / Concurrency ────────────────────────────────────
workers:
  max_workers: 10                 # ThreadPoolExecutor max threads
  frame_skip: 0                   # process every Nth frame (0 = all)
  reconnect_delay_seconds: 5      # wait before retrying failed stream
  max_reconnect_attempts: 10      # 0 = infinite

# ── Snapshot Naming ─────────────────────────────────────────
snapshot:
  filename_pattern: "{timestamp}_{label}.jpg"
  timestamp_format: "%Y%m%d_%H%M%S"
